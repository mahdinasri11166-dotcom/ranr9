# Minimal Kubernetes skeleton for the gateway
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gguf-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gguf-gateway
  template:
    metadata:
      labels:
        app: gguf-gateway
    spec:
      containers:
        - name: gateway
          image: gguf-runner-gateway:2.1
          ports:
            - containerPort: 8000
          env:
            - name: GGUF_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: gguf-api
                  key: keys
            - name: LLAMA_SERVER_URL
              value: http://llama-svc:8080
---
apiVersion: v1
kind: Service
metadata:
  name: gguf-gateway
spec:
  selector:
    app: gguf-gateway
  ports:
    - port: 80
      targetPort: 8000
